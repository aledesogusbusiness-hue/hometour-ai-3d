<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeTour.ai - 3D Experience</title>
  <link rel="stylesheet" href="/src/style.css" />
  
  <!-- Libreria per il Joystick Virtuale -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js",
        "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="/assets/logo.jpg" alt="HomeTour.ai" />
      </div>
      <div class="top-actions">
        <button class="ghost-btn" id="aboutBtn">How it works</button>
        <button class="solid-btn" id="fullscreenBtn">Fullscreen</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">IMMERSIVE PROPERTY EXPERIENCES</p>
          <h1>Walk through a space.<br><em>Before you visit it.</em></h1>
          <p class="lede">
            HomeTour.ai turns real spaces into interactive 3D experiences,
            accessible directly from the browser.
          </p>
          <div class="hero-actions">
            <button class="solid-btn large" id="exploreBtn">Explore the space <span>↗</span></button>
            <button class="ghost-btn large" id="infoBtn">Discover HomeTour.ai</button>
          </div>
        </div>

        <div class="viewer-wrap" id="viewerWrap" style="position: relative; min-height: 450px; width: 100%;">
          <div id="viewer" style="width: 100%; height: 100%; min-height: 450px;"></div>
          
          <!-- Contenitore Joystick (in basso a sinistra) -->
          <div id="joystickZone" style="position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px; z-index: 10000; touch-action: none;"></div>

          <div class="viewer-overlay">
            <div class="viewer-status"><span class="status-dot"></span> LIVE 3D VIEW</div>
            <div class="viewer-hint">Usa il joystick per camminare</div>
          </div>
          <div class="loader" id="loader">
            <div class="spinner"></div>
            <span>Loading Gaussian Splat…</span>
          </div>
          <div class="viewer-error" id="viewerError" style="display: none; position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(180, 0, 0, 0.95); color: white; padding: 12px; font-size: 11px; font-family: monospace; word-break: break-all; z-index: 9999;">
            <strong style="display:block; margin-bottom: 4px;">3D Viewer Error:</strong>
            <span id="errorMessage">Init error</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

    const viewer = document.querySelector('#viewer');
    const loader = document.querySelector('#loader');
    const errorBox = document.querySelector('#viewerError');
    const errorMessage = document.querySelector('#errorMessage');

    // Vettori di movimento per il joystick
    let moveVector = { x: 0, y: 0 };

    // PERIMETRO (Mura invisibili per non far uscire le persone)
    // Puoi regolare questi 4 valori per stringere o allargare la stanza
    const BOUNDS = {
      minX: -2.5,
      maxX: 2.5,
      minZ: -2.5,
      maxZ: 2.5
    };

    function showError(msg) {
      if (loader) loader.classList.add('hidden');
      if (errorBox) errorBox.style.display = 'block';
      if (errorMessage) errorMessage.innerText = String(msg);
    }

    async function init() {
      try {
        const width = viewer.clientWidth || window.innerWidth;
        const height = viewer.clientHeight || 450;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(width, height);
        viewer.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf7f6f2);

        const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
        camera.position.set(0, 1.35, 3.2);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const spark = new SparkRenderer({ renderer });
        scene.add(spark);

        const res = await fetch('/assets/bedroom.spz');
        if (!res.ok) {
          showError(`HTTP Error ${res.status}: Impossibile scaricare /assets/bedroom.spz`);
          return;
        }

        const arrayBuffer = await res.arrayBuffer();
        if (arrayBuffer.byteLength < 1000) {
          showError(`File SPZ non valido (${arrayBuffer.byteLength} bytes). Controlla Git LFS.`);
          return;
        }

        const splat = new SplatMesh({
          fileBytes: arrayBuffer
        });

        // Orientamento corretto
        splat.rotation.z = Math.PI;

        scene.add(splat);

        if (loader) loader.classList.add('hidden');
        if (errorBox) errorBox.style.display = 'none';

        // INIZIALIZZAZIONE JOYSTICK
        if (typeof nipplejs !== 'undefined') {
          const joystick = nipplejs.create({
            zone: document.getElementById('joystickZone'),
            mode: 'static',
            position: { left: '50px', bottom: '50px' },
            color: '#111111',
            size: 80
          });

          joystick.on('move', (evt, data) => {
            if (data.vector) {
              moveVector.x = data.vector.x;
              moveVector.y = data.vector.y;
            }
          });

          joystick.on('end', () => {
            moveVector.x = 0;
            moveVector.y = 0;
          });
        }

        window.addEventListener('resize', () => {
          const w = viewer.clientWidth || window.innerWidth;
          const h = viewer.clientHeight || 450;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        // CICLO DI ANIMAZIONE CON CALCOLO CONFINI
        const speed = 0.04;
        function animate() {
          requestAnimationFrame(animate);

          // Movimento tramite joystick
          if (moveVector.x !== 0 || moveVector.y !== 0) {
            let nextX = camera.position.x + moveVector.x * speed;
            let nextZ = camera.position.z - moveVector.y * speed;

            // Mura/Limiti: blocca la telecamera entro i valori min e max
            camera.position.x = Math.max(BOUNDS.minX, Math.min(BOUNDS.maxX, nextX));
            camera.position.z = Math.max(BOUNDS.minZ, Math.min(BOUNDS.maxZ, nextZ));

            // Aggiorna la mira dei controlli
            controls.target.x = camera.position.x;
            controls.target.z = camera.position.z - 1;
          }

          controls.update();
          renderer.render(scene, camera);
        }
        animate();

      } catch (e) {
        console.error("3D Init Exception:", e);
        showError(`${e.name || 'Error'}: ${e.message || String(e)}`);
      }
    }

    if (document.readyState === 'complete') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>
